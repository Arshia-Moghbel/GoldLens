name: iOS build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build iOS app and widget extension
        run: >-
          xcodebuild
          -project GoldLens.xcodeproj
          -scheme GoldLens
          -configuration Debug
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          build
